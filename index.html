<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cancha de Baloncesto 3D v2</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@1.4.0/dist/aframe-physics-system.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border-radius: 5px;
        font-size: 12px;
      }
      #instrucciones {
        position: absolute;
        bottom: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        background: rgba(0,0,0,0.6);
        padding: 10px;
        border-radius: 5px;
        font-size: 11px;
        max-width: 300px;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Cancha de Baloncesto 3D v2<br>
      28m × 15m | Aro: 3.05m
    </div>
    <div id="instrucciones">
      <strong>Controles Mejorados:</strong><br>
      🖱️ <strong>Click</strong> en el balón para agarrarlo<br>
      🖱️ <strong>Mueve el ratón</strong> para manipular (arriba/abajo/lados)<br>
      🖱️ <strong>Scroll</strong> para acercar/alejar el balón<br>
      🖱️ <strong>Suelta</strong> (mouseup) para lanzar<br>
      ⌨️ <strong>ESC</strong> para soltar rápido<br>
      ⌨️ <strong>WASD</strong>: Movimiento | <strong>Ratón</strong>: Mirar
    </div>
    
    <a-scene physics="debug: false" background="color: #87CEEB">
      <!-- Iluminación uniforme desde arriba -->
      <a-light type="ambient" color="#FFFFFF" intensity="1.0"></a-light>
      <a-light type="directional" color="#FFFFFF" intensity="0.5" position="0 20 0"></a-light>

      <!-- ═══════════════════════════════════════ -->
      <!-- PISO: Cancha de baloncesto 28m × 15m -->
      <!-- ═══════════════════════════════════════ -->
      <a-box 
        id="piso-cancha"
        position="0 0 0"
        width="28"
        height="0.05"
        depth="15"
        color="#E8A04C"
        material="flat"
        static-body>
      </a-box>

      <!-- ═══════════════════════════════════════ -->
      <!-- LÍNEAS REGLAMENTARIAS -->
      <!-- ═══════════════════════════════════════ -->

      <!-- Línea central (X axis) -->
      <a-box 
        position="0 0.03 0" 
        width="0.08" 
        depth="15"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea lateral izquierda (Z axis) -->
      <a-box 
        position="0 0.03 7.5" 
        width="28"
        depth="0.08"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea lateral derecha (Z axis) -->
      <a-box 
        position="0 0.03 -7.5" 
        width="28"
        depth="0.08"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea de fondo izquierda (Z axis) -->
      <a-box 
        position="-14 0.03 0" 
        width="0.08"
        depth="15"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea de fondo derecha (Z axis) -->
      <a-box 
        position="14 0.03 0" 
        width="0.08"
        depth="15"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- ═══════════════════════════════════════ -->
      <!-- CANASTA DE BALONCESTO PROFESIONAL -->
      <!-- ESTRUCTURA ÚNICA INTEGRADA -->
      <!-- Rotada 90 grados hacia la derecha -->
      <!-- Movida al extremo de la cancha -->
      <!-- ═══════════════════════════════════════ -->
      <a-entity id="canasta-completa" position="13 0 0" rotation="0 90 0">
        
        <!-- BASE RECTANGULAR SÓLIDA (en el piso) -->
        <a-box 
          id="base-canasta-integrada"
          position="0 0.2 0"
          width="1.0"
          height="0.4"
          depth="1.0"
          color="#2A2A2A"
          material="flat">
        </a-box>

        <!-- POSTE VERTICAL METÁLICO (unido a base) -->
        <a-box 
          id="poste-canasta-integrado"
          position="0 2.1 0"
          width="0.12"
          height="3.4"
          depth="0.12"
          color="#1F1F1F"
          material="flat">
        </a-box>

        <!-- BRAZO HORIZONTAL METÁLICO (unido al poste) -->
        <a-box 
          id="brazo-canasta-integrado"
          position="0 3.05 -0.6"
          width="0.1"
          height="0.1"
          depth="1.2"
          color="#333333"
          material="flat">
        </a-box>

        <!-- TABLERO GRIS (unido firmemente al brazo) -->
        <a-box 
          id="tablero-canasta-integrado"
          position="0 2.55 -1.2"
          width="1.05"
          height="1.05"
          depth="0.05"
          color="#C0C0C0"
          material="flat">
        </a-box>

        <!-- MARCO DEL TABLERO (refuerzo metálico) -->
        <a-box 
          id="marco-tablero-integrado"
          position="0 2.55 -1.19"
          width="1.15"
          height="1.15"
          depth="0.1"
          color="#2A2A2A"
          material="flat">
        </a-box>

        <!-- ARO CIRCULAR NARANJA (fijado al tablero) -->
        <a-torus 
          id="aro-canasta-integrado"
          position="0 2.9 -1.4"
          radius="0.225"
          radius-tubular="0.02"
          color="#FF8C00"
          material="flat"
          rotation="90 0 0">
        </a-torus>

        <!-- RED BLANCA COLGANTE (suspendida del aro) -->
        <a-cylinder 
          id="red-canasta-integrada"
          position="0 2.35 -1.4"
          radius="0.22"
          height="0.7"
          color="#FFFFFF"
          material="flat"
          opacity="0.75">
        </a-cylinder>

      </a-entity>

      <!-- ═══════════════════════════════════════ -->
      <!-- BALÓN DE BALONCESTO -->
      <!-- Ubicado en el centro de la cancha -->
      <!-- ═══════════════════════════════════════ -->
      <a-sphere 
        id="balon-baloncesto"
        position="0 0.12 0"
        radius="0.12"
        color="#FF0000"
        material="flat"
        dynamic-body
        data-agarrado="false">
      </a-sphere>

      <!-- ═══════════════════════════════════════ -->
      <!-- CANASTA DE BALONCESTO SIMÉTRICA -->
      <!-- Lado opuesto de la cancha -->
      <!-- ═══════════════════════════════════════ -->
      <a-entity id="canasta-completa-simetrica" position="-13 0 0" rotation="0 -90 0">
        
        <!-- BASE RECTANGULAR SÓLIDA (en el piso) -->
        <a-box 
          id="base-canasta-integrada-2"
          position="0 0.2 0"
          width="1.0"
          height="0.4"
          depth="1.0"
          color="#2A2A2A"
          material="flat">
        </a-box>

        <!-- POSTE VERTICAL METÁLICO (unido a base) -->
        <a-box 
          id="poste-canasta-integrado-2"
          position="0 2.1 0"
          width="0.12"
          height="3.4"
          depth="0.12"
          color="#1F1F1F"
          material="flat">
        </a-box>

        <!-- BRAZO HORIZONTAL METÁLICO (unido al poste) -->
        <a-box 
          id="brazo-canasta-integrado-2"
          position="0 3.05 -0.6"
          width="0.1"
          height="0.1"
          depth="1.2"
          color="#333333"
          material="flat">
        </a-box>

        <!-- TABLERO GRIS (unido firmemente al brazo) -->
        <a-box 
          id="tablero-canasta-integrado-2"
          position="0 2.55 -1.2"
          width="1.05"
          height="1.05"
          depth="0.05"
          color="#C0C0C0"
          material="flat">
        </a-box>

        <!-- MARCO DEL TABLERO (refuerzo metálico) -->
        <a-box 
          id="marco-tablero-integrado-2"
          position="0 2.55 -1.19"
          width="1.15"
          height="1.15"
          depth="0.1"
          color="#2A2A2A"
          material="flat">
        </a-box>

        <!-- ARO CIRCULAR NARANJA (fijado al tablero) -->
        <a-torus 
          id="aro-canasta-integrado-2"
          position="0 2.9 -1.4"
          radius="0.225"
          radius-tubular="0.02"
          color="#FF8C00"
          material="flat"
          rotation="90 0 0">
        </a-torus>

        <!-- RED BLANCA COLGANTE (suspendida del aro) -->
        <a-cylinder 
          id="red-canasta-integrada-2"
          position="0 2.35 -1.4"
          radius="0.22"
          height="0.7"
          color="#FFFFFF"
          material="flat"
          opacity="0.75">
        </a-cylinder>

      </a-entity>
      <!-- ═══════════════════════════════════════ -->
      <!-- CÁMARA Y CONTROLES -->
      <!-- ═══════════════════════════════════════ -->
      <a-entity 
        id="camera"
        camera 
        position="0 1.7 10" 
        look-controls
        wasd-controls>
      </a-entity>

    </a-scene>

    <script>
      // Sistema mejorado de agarre y lanzamiento del balón
      let balonAggarado = false;
      let balonElement = document.getElementById('balon-baloncesto');
      let cameraElement = document.getElementById('camera');
      
      let velocidadMouseX = 0;
      let velocidadMouseY = 0;
      let posicionMouseAnterior = { x: 0, y: 0 };
      let distanciaBalonCamara = 2.5;

      // Mejorar detección del click en el balón
      document.addEventListener('mousedown', (event) => {
        if (!cameraElement || !balonElement) return;
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        const cameraObj = cameraElement.getObject3D('camera');
        raycaster.setFromCamera(mouse, cameraObj);

        const balonMesh = balonElement.getObject3D('mesh');
        if (balonMesh) {
          const intersects = raycaster.intersectObject(balonMesh);

          if (intersects.length > 0 && !balonAggarado) {
            // Agarrar el balón
            balonAggarado = true;
            balonElement.setAttribute('data-agarrado', 'true');
            balonElement.setAttribute('color', '#FF5555'); // Cambiar color
            
            // Detener movimiento
            if (balonElement.body) {
              balonElement.body.velocity.set(0, 0, 0);
              balonElement.body.angularVelocity.set(0, 0, 0);
            }
            
            posicionMouseAnterior = { x: event.clientX, y: event.clientY };
            velocidadMouseX = 0;
            velocidadMouseY = 0;
          }
        }
      });

      // Soltar el balón con click derecho o tecla
      document.addEventListener('mouseup', (event) => {
        if (balonAggarado) {
          // Soltar el balón y lanzarlo
          balonAggarado = false;
          balonElement.setAttribute('data-agarrado', 'false');
          balonElement.setAttribute('color', '#FF0000'); // Volver al color original

          if (balonElement.body) {
            // Obtener dirección hacia donde mira la cámara
            const cameraObject = cameraElement.getObject3D('camera');
            const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(cameraObject.quaternion);
            
            // Velocidad base más velocidad del mouse
            const velocidadBase = 25;
            const velocidadMouse = Math.sqrt(velocidadMouseX ** 2 + velocidadMouseY ** 2) * 0.3;
            
            // Aplicar velocidad
            balonElement.body.velocity.set(
              direction.x * velocidadBase + velocidadMouseX * 0.8,
              direction.y * velocidadBase + velocidadMouseY * 0.8,
              direction.z * velocidadBase
            );

            // Agregar rotación al balón
            balonElement.body.angularVelocity.set(
              velocidadMouseY * 0.5,
              velocidadMouseX * 0.5,
              (velocidadMouseX - velocidadMouseY) * 0.3
            );
          }
        }
      });

      // Movimiento mejorado del mouse mientras el balón está agarrado
      window.addEventListener('mousemove', (event) => {
        if (balonAggarado && cameraElement && balonElement) {
          // Calcular velocidad del mouse
          velocidadMouseX = (event.clientX - posicionMouseAnterior.x);
          velocidadMouseY = (event.clientY - posicionMouseAnterior.y);

          // Posicionar el balón frente a la cámara
          const cameraObject = cameraElement.getObject3D('camera');
          const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(cameraObject.quaternion);
          const cameraPos = cameraElement.getAttribute('position');
          
          // Permitir mover el balón hacia arriba/abajo con el mouse
          const offsetVertical = (event.clientY - window.innerHeight / 2) * 0.002;
          const offsetHorizontal = (event.clientX - window.innerWidth / 2) * 0.002;
          
          const posX = cameraPos.x + direction.x * distanciaBalonCamara + offsetHorizontal;
          const posY = cameraPos.y + direction.y * distanciaBalonCamara + offsetVertical;
          const posZ = cameraPos.z + direction.z * distanciaBalonCamara;

          balonElement.setAttribute('position', {
            x: posX,
            y: posY,
            z: posZ
          });

          // Aplicar pequeña rotación visual mientras se mueve
          if (balonElement.body) {
            balonElement.body.velocity.set(0, 0, 0);
            balonElement.body.angularVelocity.set(0, 0, 0);
          }

          posicionMouseAnterior = { x: event.clientX, y: event.clientY };
        }
      });

      // Ajustar distancia del balón con scroll
      window.addEventListener('wheel', (event) => {
        if (balonAggarado) {
          event.preventDefault();
          distanciaBalonCamara += event.deltaY > 0 ? -0.1 : 0.1;
          distanciaBalonCamara = Math.max(1.5, Math.min(4, distanciaBalonCamara));
        }
      }, { passive: false });

      // Soltar balón con tecla ESC
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && balonAggarado) {
          const mouseUpEvent = new MouseEvent('mouseup');
          document.dispatchEvent(mouseUpEvent);
        }
      });
    </script>

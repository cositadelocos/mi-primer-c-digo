<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cancha de Baloncesto 3D v2</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border-radius: 5px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Cancha de Baloncesto 3D v2<br>
      28m × 15m | Aro: 3.05m
    </div>
    
    <a-scene background="color: #D3D3D3">
      <!-- Iluminación uniforme desde arriba -->
      <a-light type="ambient" color="#FFFFFF" intensity="1.0"></a-light>
      <a-light type="directional" color="#FFFFFF" intensity="0.5" position="0 20 0"></a-light>

      <!-- ═══════════════════════════════════════ -->
      <!-- PISO: Cancha de baloncesto 28m × 15m -->
      <!-- ═══════════════════════════════════════ -->
      <a-box 
        id="piso-cancha"
        position="0 0 0"
        width="28"
        height="0.05"
        depth="15"
        color="#E8A04C"
        material="flat">
      </a-box>

      <!-- ═══════════════════════════════════════ -->
      <!-- LÍNEAS REGLAMENTARIAS -->
      <!-- ═══════════════════════════════════════ -->

      <!-- Línea central (X axis) -->
      <a-box 
        position="0 0.03 0" 
        width="0.08" 
        depth="15"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea lateral izquierda (Z axis) -->
      <a-box 
        position="0 0.03 7.5" 
        width="28"
        depth="0.08"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea lateral derecha (Z axis) -->
      <a-box 
        position="0 0.03 -7.5" 
        width="28"
        depth="0.08"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea de fondo izquierda (Z axis) -->
      <a-box 
        position="-14 0.03 0" 
        width="0.08"
        depth="15"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea de fondo derecha (Z axis) -->
      <a-box 
        position="14 0.03 0" 
        width="0.08"
        depth="15"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- ═══════════════════════════════════════ -->
      <!-- CANASTA DE BALONCESTO - Lado positivo Z -->
      <!-- Centrada en X=0, posicionada en Z=14 -->
      <!-- ═══════════════════════════════════════ -->

      <!-- BASE DEL POSTE (sobre el piso) -->
      <a-box 
        id="base-canasta"
        position="0 0.25 14"
        width="0.8"
        height="0.5"
        depth="0.8"
        color="#2C2C2C"
        material="flat">
      </a-box>

      <!-- POSTE VERTICAL (alineado a eje Y) -->
      <a-box 
        id="poste-canasta"
        position="0 1.525 14"
        width="0.15"
        height="3.05"
        depth="0.15"
        color="#1A1A1A"
        material="flat">
      </a-box>

      <!-- BRAZO HORIZONTAL (perpendicular, alineado a eje X) -->
      <a-box 
        id="brazo-canasta"
        position="0 3.05 13"
        width="1.2"
        height="0.12"
        depth="0.12"
        color="#333333"
        material="flat">
      </a-box>

      <!-- TABLERO VERTICAL (perpendicular al suelo) -->
      <!-- Posición: centrado en X, alineado al plano YZ -->
      <a-box 
        id="tablero-canasta"
        position="0.5 2.55 12.15"
        width="0.06"
        height="1.05"
        depth="1.8"
        color="#87CEEB"
        material="flat"
        opacity="0.3">
      </a-box>

      <!-- MARCO DEL TABLERO (metal gris) -->
      <a-box 
        id="marco-tablero"
        position="0.5 2.55 12.15"
        width="0.12"
        height="1.15"
        depth="1.9"
        color="#555555"
        material="flat">
      </a-box>

      <!-- ARO (tubo metálico naranja, horizontal) -->
      <a-torus 
        id="aro-canasta"
        position="0.5 3.05 12.4"
        radius="0.225"
        radius-tubular="0.025"
        color="#FF8C00"
        material="flat"
        rotation="90 0 0">
      </a-torus>

      <!-- RED (cilindro colgante) -->
      <a-cylinder 
        id="red-canasta"
        position="0.5 2.3 12.4"
        radius="0.22"
        height="0.75"
        color="#FFFFFF"
        material="flat"
        opacity="0.7">
      </a-cylinder>

      <!-- ═══════════════════════════════════════ -->
      <!-- CÁMARA Y CONTROLES -->
      <!-- ═══════════════════════════════════════ -->
      <a-entity 
        id="camera"
        camera 
        position="0 1.7 10" 
        look-controls
        wasd-controls>
      </a-entity>

    </a-scene>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cancha de Baloncesto 3D v2</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-family: monospace;
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border-radius: 5px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="info">
      Cancha de Baloncesto 3D v2<br>
      28m × 15m | Aro: 3.05m
    </div>
    
    <a-scene background="color: #87CEEB">
      <!-- Iluminación uniforme desde arriba -->
      <a-light type="ambient" color="#FFFFFF" intensity="1.0"></a-light>
      <a-light type="directional" color="#FFFFFF" intensity="0.5" position="0 20 0"></a-light>

      <!-- ═══════════════════════════════════════ -->
      <!-- PISO: Cancha de baloncesto 28m × 15m -->
      <!-- ═══════════════════════════════════════ -->
      <a-box 
        id="piso-cancha"
        position="0 0 0"
        width="28"
        height="0.05"
        depth="15"
        color="#E8A04C"
        material="flat">
      </a-box>

      <!-- ═══════════════════════════════════════ -->
      <!-- LÍNEAS REGLAMENTARIAS -->
      <!-- ═══════════════════════════════════════ -->

      <!-- Línea central (X axis) -->
      <a-box 
        position="0 0.03 0" 
        width="0.08" 
        depth="15"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea lateral izquierda (Z axis) -->
      <a-box 
        position="0 0.03 7.5" 
        width="28"
        depth="0.08"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea lateral derecha (Z axis) -->
      <a-box 
        position="0 0.03 -7.5" 
        width="28"
        depth="0.08"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea de fondo izquierda (Z axis) -->
      <a-box 
        position="-14 0.03 0" 
        width="0.08"
        depth="15"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- Línea de fondo derecha (Z axis) -->
      <a-box 
        position="14 0.03 0" 
        width="0.08"
        depth="15"
        height="0.01" 
        color="#FFFFFF"
        material="flat">
      </a-box>

      <!-- ═══════════════════════════════════════ -->
      <!-- CANASTA DE BALONCESTO PROFESIONAL -->
      <!-- Posición: X=0 (centro), Z=7.5 (extremo cancha) -->
      <!-- Aro: Y=3.05m (altura reglamentaria) -->
      <!-- ═══════════════════════════════════════ -->

      <!-- BASE SÓLIDA RECTANGULAR (en el piso) -->
      <a-box 
        id="base-canasta-pro"
        position="0 0.25 7.5"
        width="1.0"
        height="0.5"
        depth="1.0"
        color="#2A2A2A"
        material="flat">
      </a-box>

      <!-- POSTE VERTICAL METÁLICO (recto, eje Y) -->
      <a-box 
        id="poste-canasta-pro"
        position="0 1.525 7.5"
        width="0.12"
        height="3.05"
        depth="0.12"
        color="#1F1F1F"
        material="flat">
      </a-box>

      <!-- BRAZO HORIZONTAL (sostiene tablero, perpendicular eje X) -->
      <a-box 
        id="brazo-canasta-pro"
        position="0 3.05 6.55"
        width="0.1"
        height="0.1"
        depth="0.95"
        color="#333333"
        material="flat">
      </a-box>

      <!-- TABLERO RECTANGULAR VERTICAL -->
      <!-- Perpendicular al piso, paralelo al eje X -->
      <!-- Plano XY vertical, centrado en X -->
      <a-box 
        id="tablero-canasta-pro"
        position="0 2.5 5.75"
        width="1.05"
        height="1.05"
        depth="0.05"
        color="#C0C0C0"
        material="flat">
      </a-box>

      <!-- MARCO DEL TABLERO (metal oscuro, borde) -->
      <a-box 
        id="marco-tablero-pro"
        position="0 2.5 5.76"
        width="1.15"
        height="1.15"
        depth="0.08"
        color="#2A2A2A"
        material="flat">
      </a-box>

      <!-- ARO CIRCULAR METÁLICO NARANJA -->
      <!-- Horizontal, orientado hacia centro de cancha (eje Z) -->
      <a-torus 
        id="aro-canasta-pro"
        position="0 3.05 6.0"
        radius="0.225"
        radius-tubular="0.02"
        color="#FF8C00"
        material="flat"
        rotation="90 0 0">
      </a-torus>

      <!-- RED BLANCA COLGANTE -->
      <a-cylinder 
        id="red-canasta-pro"
        position="0 2.3 6.0"
        radius="0.22"
        height="0.7"
        color="#FFFFFF"
        material="flat"
        opacity="0.75">
      </a-cylinder>

      <!-- ═══════════════════════════════════════ -->
      <!-- CÁMARA Y CONTROLES -->
      <!-- ═══════════════════════════════════════ -->
      <a-entity 
        id="camera"
        camera 
        position="0 1.7 10" 
        look-controls
        wasd-controls>
      </a-entity>

    </a-scene>
  </body>
</html>
